{% extends 'perpustakaan/base.html' %}

{% block content %}
<h1>Daftar Anggota</h1>

<a href="{% url 'tambah_anggota' %}" class="btn">Tambah Anggota</a>

<br><br>

<table>
    <tr>
        <th>No</th>
        <th>Nama</th>
        <th>Email</th>
        <th>Alamat</th>
        <th>Aksi</th>
    </tr>

    {% for item in anggota %}
    <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ item.nama }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.alamat }}</td>
        <td>
            <a href="{% url 'edit_anggota' item.id %}">Edit</a> |
            <a href="{% url 'hapus_anggota' item.id %}">Hapus</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="5">Belum ada data anggota.</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
