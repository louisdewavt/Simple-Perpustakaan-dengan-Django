{% extends 'perpustakaan/base.html' %} {% block content %}
<h1>Daftar Kategori</h1>

<a href="{% url 'tambah_kategori' %}">Tambah Kategori</a>

<table border="1" cellpadding="8">
  <thead>
    <tr>
      <th>No.</th>
      <th>Nama Kategori</th>
    </tr>
  </thead>

  <tbody>
    {% for item in kategori %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ item.nama_kategori }}</td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="2">Belum ada kategori.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
